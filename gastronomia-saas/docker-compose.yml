name: gastronomia
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:?Completar ACCEPT_EULA en el archivo externo}
      MSSQL_PID: ${MSSQL_PID:?Configurar edicion SQL Server}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configurar password de bootstrap}
    volumes:
      - sql-data:/var/opt/mssql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1" -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  db-init:
    image: gastronomia-api:${IMAGE_TAG:-local}
    build: .
    restart: "no"
    entrypoint: ["dotnet", "/migrator/Gastronomia.Migrate.dll"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DatabaseBootstrap__SaPassword: ${MSSQL_SA_PASSWORD:?Configurar password de bootstrap}
      DatabaseBootstrap__Name: ${DB_NAME:?Configurar nombre de base}
      DatabaseBootstrap__AppPassword: ${DB_APP_PASSWORD:?Configurar password de la API}
      DatabaseBootstrap__TenantId: ${MERCADOPAGO_TENANT_ID:?Configurar tenant del vendedor}
      DatabaseBootstrap__TenantName: ${TENANT_NAME:?Configurar nombre del local}
      DatabaseBootstrap__WhatsApp: ${TENANT_WHATSAPP:?Configurar WhatsApp del local}
    networks: [backend]

  api:
    image: gastronomia-api:${IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    # Publicar detrás de un proxy HTTPS en el host. SQL Server no expone puertos al host.
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SqlServer: ${SQLSERVER_APP_CONNECTION_STRING:?Configurar conexion con usuario gastronomia_api}
      AllowedHosts: ${ALLOWED_HOSTS:?Configurar dominio publico}
      Authentication__Authority: ${STAFF_OIDC_AUTHORITY:?Configurar OIDC del panel}
      Authentication__Audience: ${STAFF_OIDC_AUDIENCE:?Configurar audience del panel}
      CustomerAuth__JwtKey: ${CUSTOMER_JWT_KEY_BASE64:?Configurar JWT de clientes}
      CustomerAuth__OtpKey: ${CUSTOMER_OTP_KEY_BASE64:?Configurar HMAC de OTP}
      CustomerAuth__Issuer: ${CUSTOMER_JWT_ISSUER:?Configurar issuer}
      CustomerAuth__Audience: ${CUSTOMER_JWT_AUDIENCE:?Configurar audience}
      Checkout__Origins__0: ${CUSTOMER_WEB_ORIGIN:?Configurar origen web}
      ReverseProxy__KnownProxy: ${TRUSTED_PROXY_IP:?Configurar IP del proxy confiable}
      Email__Provider: Resend
      Email__ResendApiKey: ${RESEND_API_KEY:?Configurar Resend}
      Email__From: ${RESEND_FROM:?Configurar remitente verificado}
      Payments__Provider: MercadoPago
      MercadoPago__AccessToken: ${MERCADOPAGO_ACCESS_TOKEN:?Configurar Access Token}
      MercadoPago__WebhookSecret: ${MERCADOPAGO_WEBHOOK_SECRET:?Configurar secreto de Webhooks}
      MercadoPago__TenantId: ${MERCADOPAGO_TENANT_ID:?Configurar tenant}
      MercadoPago__CollectorId: ${MERCADOPAGO_COLLECTOR_ID:?Configurar vendedor}
      MercadoPago__Sandbox: ${MERCADOPAGO_SANDBOX:?Configurar true para staging o false para produccion}
      MercadoPago__NotificationUrl: ${MERCADOPAGO_NOTIFICATION_URL:?Configurar webhook HTTPS}
      MercadoPago__SuccessUrl: ${MERCADOPAGO_SUCCESS_URL:?Configurar retorno exitoso}
      MercadoPago__FailureUrl: ${MERCADOPAGO_FAILURE_URL:?Configurar retorno fallido}
      MercadoPago__PendingUrl: ${MERCADOPAGO_PENDING_URL:?Configurar retorno pendiente}
    volumes:
      - api-data:/app/App_Data
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  sql-data:
  api-data:
networks:
  backend:
    driver: bridge
